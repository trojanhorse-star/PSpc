[package]
name = "plazma-s-pc"
version = "0.1.0"
description = "Private PC-to-PC file transfer for Windows"
authors = ["Plazma S PC"]
edition = "2021"
[lib]
name = "plazma_s_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }