name: Publish signed Plazma S PC update
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret.' }
          $config = Get-Content src-tauri/tauri.release.conf.json -Raw | ConvertFrom-Json
          if ($config.plugins.updater.pubkey -like 'REPLACE_*') { throw 'Replace the updater public-key placeholder before publishing.' }
      - name: Install frontend dependencies
        run: npm install
      - name: Build signed NSIS updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Generate Tauri updater manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS updater installer was not produced.' }
          $signature = Get-Content ($installer.FullName + '.sig') -Raw
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'Signed updater signature is missing.' }
          $download = "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
          $manifest = @{ version = '${{ github.ref_name }}'.TrimStart('v'); notes = 'Plazma S PC update'; pub_date = (Get-Date).ToUniversalTime().ToString('o'); platforms = @{ 'windows-x86_64' = @{ url = $download; signature = $signature.Trim() } } }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content latest.json -Encoding utf8
          Copy-Item $installer.FullName .
          Copy-Item ($installer.FullName + '.sig') .
      - name: Publish GitHub release and update manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.exe
            *.exe.sig
            latest.json
